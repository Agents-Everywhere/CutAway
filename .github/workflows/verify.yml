name: Verify Cutaway

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      COPILOTKIT_TELEMETRY_DISABLED: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build the isolated test runtime
        run: docker build -f infra/codex-worker/Dockerfile -t cutaway-codex-worker infra/codex-worker
      - name: Check types, behavior, lint and production builds
        run: npm run verify:cutaway
      - name: Validate the implementation specification
        run: python3 Cutaway-OpenSpec/scripts/check-spec.py
